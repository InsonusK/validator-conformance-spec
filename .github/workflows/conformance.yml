name: Conformance tests

on:
  pull_request:
    branches:
      - master
    path:
      - 'features/**'

jobs:
  demo-ts:
    name: validator-conformance-demo-ts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spec (this repo)
        uses: actions/checkout@v4
        with:
          path: spec

      - name: Checkout validator-conformance-demo-ts
        uses: actions/checkout@v4
        with:
          repository: InsonusK/validator-conformance-demo-ts
          submodules: recursive
          path: demo-ts

      - name: Use spec from this commit instead of the pinned submodule
        run: |
          rm -rf demo-ts/specs
          cp -r spec demo-ts/specs
          rm -rf demo-ts/specs/.git

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run library tests against the spec
        run: make -C demo-ts test

  demo-dotnet:
    name: validator-conformance-demo-dotnet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spec (this repo)
        uses: actions/checkout@v4
        with:
          path: spec

      - name: Checkout validator-conformance-demo-dotnet
        uses: actions/checkout@v4
        with:
          repository: InsonusK/validator-conformance-demo-dotnet
          submodules: recursive
          path: demo-dotnet

      - name: Use spec from this commit instead of the pinned submodule
        run: |
          rm -rf demo-dotnet/specs
          cp -r spec demo-dotnet/specs
          rm -rf demo-dotnet/specs/.git

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run library tests against the spec
        run: make -C demo-dotnet test

  mutation-ts:
    name: validator-conformance-demo-ts-mutation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spec (this repo)
        uses: actions/checkout@v4
        with:
          path: spec

      - name: Checkout validator-conformance-demo-ts
        uses: actions/checkout@v4
        with:
          repository: InsonusK/validator-conformance-demo-ts
          submodules: recursive
          path: demo-ts

      - name: Use spec from this commit instead of the pinned submodule
        run: |
          rm -rf demo-ts/specs
          cp -r spec demo-ts/specs
          rm -rf demo-ts/specs/.git

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run mutation tests against the spec
        run: make -C demo-ts mutation

  mutation-dotnet:
    name: validator-conformance-demo-dotnet-mutation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spec (this repo)
        uses: actions/checkout@v4
        with:
          path: spec

      - name: Checkout validator-conformance-demo-dotnet
        uses: actions/checkout@v4
        with:
          repository: InsonusK/validator-conformance-demo-dotnet
          submodules: recursive
          path: demo-dotnet

      - name: Use spec from this commit instead of the pinned submodule
        run: |
          rm -rf demo-dotnet/specs
          cp -r spec demo-dotnet/specs
          rm -rf demo-dotnet/specs/.git

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run mutation tests against the spec
        run: make -C demo-dotnet mutation

  result:
    name: test-result
    runs-on: ubuntu-latest
    needs: [demo-ts, demo-dotnet, mutation-ts, mutation-dotnet]
    if: always()
    steps:
      - name: Check all tests passed
        run: |
          if [[ \
            "${{ needs.demo-ts.result }}" == "success" && \
            "${{ needs.demo-dotnet.result }}" == "success" && \
            "${{ needs.mutation-ts.result }}" == "success" && \
            "${{ needs.mutation-dotnet.result }}" == "success" \
          ]]; then
            echo "All tests passed"
            exit 0
          else
            echo "Some tests failed: demo-ts=${{ needs.demo-ts.result }}, demo-dotnet=${{ needs.demo-dotnet.result }}, mutation-ts=${{ needs.mutation-ts.result }}, mutation-dotnet=${{ needs.mutation-dotnet.result }}"
            exit 1
          fi
